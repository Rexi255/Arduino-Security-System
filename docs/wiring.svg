<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<style>
  .w  { fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; opacity: .55; }
  /* a bright pulse travels along each wire, out of the Uno or into it */
  .p  { fill: none; stroke-width: 4.5; stroke-linecap: round; stroke-dasharray: 16 400; animation: out 2.4s linear infinite; }
  .in { animation-name: in; }
  @keyframes out { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -416 } }
  @keyframes in  { from { stroke-dashoffset: -416 } to { stroke-dashoffset: 0 } }
  .d1 { animation-delay: -.3s } .d2 { animation-delay: -.6s } .d3 { animation-delay: -.9s }
  .d4 { animation-delay: -1.2s } .d5 { animation-delay: -1.5s } .d6 { animation-delay: -1.8s } .d7 { animation-delay: -2.1s }
  .ring { animation: ring 1.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes ring { 0% { transform: scale(.5); opacity: .8 } 100% { transform: scale(1.5); opacity: 0 } }
  .lbl { font-size: 13px; font-weight: 700; fill: #E2E8F0; }
  .sub { font-size: 11.5px; fill: #94A3B8; }
  .pin { font-size: 9px; font-weight: 600; fill: #CBD5E1; text-anchor: middle; }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E131C"/><stop offset="1" stop-color="#18202E"/></linearGradient>
  <radialGradient id="dome" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C9CFD8"/></radialGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#FFFFFF" opacity=".05"/></pattern>
</defs>

<rect width="1200" height="640" rx="28" fill="url(#bg)"/>
<rect width="1200" height="640" rx="28" fill="url(#dots)"/>

<!-- ================= wires (base + travelling pulse) ================= -->
<!-- keypad: rows R1..R4 = D9..D6, columns C1..C4 = D5..D2 -->
<path class="w" stroke="#86EFAC" d="M572 212 V60 H860"/>
<path class="w" stroke="#A78BFA" d="M590 212 V74 H860"/>
<path class="w" stroke="#BEF264" d="M608 212 V88 H860"/>
<path class="w" stroke="#F0ABFC" d="M626 212 V102 H860"/>
<path class="w" stroke="#5EEAD4" d="M644 212 V116 H860"/>
<path class="w" stroke="#60A5FA" d="M662 212 V130 H860"/>
<path class="w" stroke="#84CC16" d="M680 212 V144 H860"/>
<path class="w" stroke="#2DD4BF" d="M698 212 V158 H860"/>
<path class="p in"    stroke="#86EFAC" d="M572 212 V60 H860"/>
<path class="p in d1" stroke="#A78BFA" d="M590 212 V74 H860"/>
<path class="p in d2" stroke="#BEF264" d="M608 212 V88 H860"/>
<path class="p in d3" stroke="#F0ABFC" d="M626 212 V102 H860"/>
<path class="p d4"    stroke="#5EEAD4" d="M644 212 V116 H860"/>
<path class="p d5"    stroke="#60A5FA" d="M662 212 V130 H860"/>
<path class="p d6"    stroke="#84CC16" d="M680 212 V144 H860"/>
<path class="p d7"    stroke="#2DD4BF" d="M698 212 V158 H860"/>

<!-- RC522: SPI on D11/D12/D13, SS = A0, RST = A1, VCC = 3.3 V -->
<path class="w" stroke="#22D3EE" d="M536 212 V160 H330"/>
<path class="w" stroke="#34D399" d="M518 212 V172 H330"/>
<path class="w" stroke="#A3E635" d="M500 212 V184 H330"/>
<path class="w" stroke="#EF4444" d="M500 408 V440 H250 V200"/>
<path class="w" stroke="#FB923C" d="M610 408 V455 H230 V200"/>
<path class="w" stroke="#F472B6" d="M628 408 V470 H210 V200"/>
<path class="p"       stroke="#22D3EE" d="M536 212 V160 H330"/>
<path class="p in d3" stroke="#34D399" d="M518 212 V172 H330"/>
<path class="p d5"    stroke="#A3E635" d="M500 212 V184 H330" style="animation-duration:1.2s"/>
<path class="p d2"    stroke="#EF4444" d="M500 408 V440 H250 V200" style="animation-duration:3.6s"/>
<path class="p d4"    stroke="#FB923C" d="M610 408 V455 H230 V200"/>
<path class="p d6"    stroke="#F472B6" d="M628 408 V470 H210 V200" style="animation-duration:3.6s"/>

<!-- buzzer on D10 -->
<path class="w" stroke="#FACC15" d="M554 212 V130 H470 V114"/>
<path class="p d1" stroke="#FACC15" d="M554 212 V130 H470 V114" style="animation-duration:1.6s"/>

<!-- PIR OUT on A2 -->
<path class="w" stroke="#F97316" d="M646 408 V520"/>
<path class="p in d2" stroke="#F97316" d="M646 408 V520" style="animation-duration:1.4s"/>

<!-- OLED I2C: SCL = A5, SDA = A4 -->
<path class="w" stroke="#E879F9" d="M700 408 V470 H850"/>
<path class="w" stroke="#FB7185" d="M682 408 V490 H850"/>
<path class="p"       stroke="#E879F9" d="M700 408 V470 H850" style="animation-duration:1.2s"/>
<path class="p in d4" stroke="#FB7185" d="M682 408 V490 H850" style="animation-duration:1.8s"/>

<!-- 9 V battery to the barrel jack -->
<path class="w" stroke="#EF4444" d="M424 356 H462"/>
<path class="w" stroke="#64748B" d="M424 372 H462"/>


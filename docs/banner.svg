<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<style>
  /* one 10 s story: disarmed -> PIN entry -> armed -> alarm -> disarmed */
  .ph-heart { animation: phHeart 10s linear infinite; }
  .ph-entry { opacity: 0; animation: phEntry 10s linear infinite; }
  .ph-armed { opacity: 0; animation: phArmed 10s linear infinite; }
  .ph-alarm { opacity: 0; animation: phAlarm 10s linear infinite; }
  @keyframes phHeart { 0%,29.9% { opacity: 1 } 30%,91.9% { opacity: 0 } 92%,100% { opacity: 1 } }
  @keyframes phEntry { 0%,29.9% { opacity: 0 } 30%,39.9% { opacity: 1 } 40%,100% { opacity: 0 } }
  @keyframes phArmed { 0%,39.9% { opacity: 0 } 40%,64.9% { opacity: 1 } 65%,100% { opacity: 0 } }
  @keyframes phAlarm { 0%,64.9% { opacity: 0 } 65%,91.9% { opacity: 1 } 92%,100% { opacity: 0 } }

  .flash { animation: flash .5s steps(1) infinite; }
  @keyframes flash { 0% { opacity: 1 } 50% { opacity: 0 } }
  .beat { animation: beat 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes beat { 0%,100% { transform: scale(1) } 15% { transform: scale(1.12) } 30% { transform: scale(1) } 45% { transform: scale(1.08) } }

  .float { animation: float 3.2s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-14px) } }
  .shadow { animation: shade 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes shade { 0%,100% { opacity: .35; transform: scale(1) } 50% { opacity: .15; transform: scale(.8) } }

  .key { animation: key 10s linear infinite; }
  @keyframes key { 0%,100% { opacity: 0 } }
  .k1 { animation-name: k1 } .k2 { animation-name: k2 } .k3 { animation-name: k3 } .k4 { animation-name: k4 }
  @keyframes k1 { 0%,30% { opacity: 0 } 31% { opacity: .85 } 33%,100% { opacity: 0 } }
  @keyframes k2 { 0%,32.5% { opacity: 0 } 33.5% { opacity: .85 } 35.5%,100% { opacity: 0 } }
  @keyframes k3 { 0%,35% { opacity: 0 } 36% { opacity: .85 } 38%,100% { opacity: 0 } }
  @keyframes k4 { 0%,37.5% { opacity: 0 } 38.5% { opacity: .85 } 40.5%,100% { opacity: 0 } }

  .ring { animation: ring 1.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes ring { 0% { transform: scale(.4); opacity: .9 } 100% { transform: scale(1.5); opacity: 0 } }
  .glow { animation: glow .5s ease-in-out infinite alternate; }
  @keyframes glow { from { opacity: .35 } to { opacity: .8 } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E131C"/><stop offset="1" stop-color="#18202E"/></linearGradient>
  <linearGradient id="side1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A3344"/><stop offset="1" stop-color="#1C2330"/></linearGradient>
  <linearGradient id="side2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#222A38"/><stop offset="1" stop-color="#161C27"/></linearGradient>
  <radialGradient id="redglow"><stop offset="0" stop-color="#F43F5E" stop-opacity=".65"/><stop offset="1" stop-color="#F43F5E" stop-opacity="0"/></radialGradient>
  <radialGradient id="dome" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C9CFD8"/></radialGradient>
  <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
  <!-- alarm skull + countdown: shape in currentColor, holes in the inherited fill -->
  <g id="alarmSkull">
    <rect x="45" y="4" width="38" height="32" rx="12" fill="currentColor"/><rect x="53" y="30" width="22" height="13" rx="4" fill="currentColor"/>
    <circle cx="55" cy="19" r="6.5"/><circle cx="73" cy="19" r="6.5"/>
    <polygon points="64,25 61,30 67,30"/>
    <text x="64" y="61" font-size="15" font-weight="700" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" fill="currentColor">30s</text>
  </g>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#FFFFFF" opacity=".05"/></pattern>
</defs>

<rect width="1200" height="460" rx="28" fill="url(#bg)"/>
<rect width="1200" height="460" rx="28" fill="url(#dots)"/>

<!-- left: title -->
<text x="72" y="104" font-size="15" font-weight="700" letter-spacing="3" fill="#7DD3FC">LF07 · ARDUINO UNO R3</text>
<text x="68" y="182" font-size="78" font-weight="800" fill="#F1F5F9" letter-spacing="-2">Projekt GAS</text>
<text x="72" y="226" font-size="24" fill="#94A3B8">Mini-Sicherheitssystem mit Keypad,</text>
<text x="72" y="256" font-size="24" fill="#94A3B8">RFID-Leser und Bewegungsmelder</text>

<rect x="72" y="288" width="112" height="36" rx="18" fill="#14532D"/><text x="90" y="312" font-size="16.5" font-weight="600" fill="#BBF7D0">PIN + #</text>
<rect x="196" y="288" width="140" height="36" rx="18" fill="#1E3A8A"/><text x="214" y="312" font-size="16.5" font-weight="600" fill="#BFDBFE">RFID-Karte</text>
<rect x="348" y="288" width="178" height="36" rx="18" fill="#713F12"/><text x="366" y="312" font-size="16.5" font-weight="600" fill="#FDE68A">Bewegungsmelder</text>
<rect x="538" y="288" width="92" height="36" rx="18" fill="#7F1D1D"/><text x="556" y="312" font-size="16.5" font-weight="600" fill="#FECACA">Alarm</text>

<text x="72" y="368" font-size="15" fill="#64748B">SH1106-OLED · RC522 · PIR · passiver Buzzer · Karten im EEPROM</text>

<!-- right: state badge -->
<g transform="translate(1085,30)">
  <g class="ph-heart"><rect x="-70" y="0" width="140" height="34" rx="17" fill="#14532D"/><circle cx="-48" cy="17" r="5" fill="#4ADE80"/><text x="-34" y="23" font-size="15" font-weight="700" letter-spacing="1.5" fill="#BBF7D0">UNSCHARF</text></g>
  <g class="ph-entry"><rect x="-70" y="0" width="140" height="34" rx="17" fill="#1E293B"/><circle cx="-48" cy="17" r="5" fill="#94A3B8"/><text x="-34" y="23" font-size="15" font-weight="700" letter-spacing="1.5" fill="#E2E8F0">PIN …</text></g>
  <g class="ph-armed"><rect x="-70" y="0" width="140" height="34" rx="17" fill="#713F12"/><circle cx="-48" cy="17" r="5" fill="#FBBF24"/><text x="-34" y="23" font-size="15" font-weight="700" letter-spacing="1.5" fill="#FDE68A">SCHARF</text></g>
  <g class="ph-alarm"><rect x="-70" y="0" width="140" height="34" rx="17" fill="#7F1D1D"/><circle class="flash" cx="-48" cy="17" r="5" fill="#F87171"/><text x="-34" y="23" font-size="15" font-weight="700" letter-spacing="1.5" fill="#FECACA">ALARM</text></g>
</g>

<!-- red glow behind the device while the alarm runs -->
<g class="ph-alarm"><ellipse class="glow" cx="915" cy="225" rx="310" ry="180" fill="url(#redglow)"/></g>

<!-- ground shadow -->
<ellipse cx="915" cy="366" rx="260" ry="40" fill="#000" opacity=".35" filter="url(#blur)"/>

<!-- isometric housing, plan 320 x 240: A(880,66) B(1157,226) C(949,346) D(672,186), height 28 -->
<polygon points="672,186 949,346 949,374 672,214" fill="url(#side1)"/>
<polygon points="949,346 1157,226 1157,254 949,374" fill="url(#side2)"/>
<polygon points="880,66 1157,226 949,346 672,186" fill="#2B3446" stroke="#3B475E" stroke-width="1.5"/>

<!-- everything on the top face is drawn in plan coordinates -->
<g transform="matrix(.866 .5 -.866 .5 880 66)">
  <!-- RFID reader (back corner, so the card can hover above empty space) -->
  <rect x="14" y="14" width="96" height="82" rx="5" fill="#1D6FD1"/>
  <rect x="24" y="22" width="76" height="54" rx="10" fill="none" stroke="#9CC6F5" stroke-width="2"/>
  <rect x="34" y="30" width="56" height="38" rx="6" fill="none" stroke="#9CC6F5" stroke-width="1.5"/>
  <g fill="#E2B340"><circle cx="27" cy="88" r="2"/><circle cx="37" cy="88" r="2"/><circle cx="47" cy="88" r="2"/><circle cx="57" cy="88" r="2"/><circle cx="67" cy="88" r="2"/><circle cx="77" cy="88" r="2"/><circle cx="87" cy="88" r="2"/><circle cx="97" cy="88" r="2"/></g>
  <rect class="shadow" x="24" y="24" width="76" height="52" rx="6" fill="#000"/>
  <rect class="ring" x="30" y="28" width="64" height="44" rx="10" fill="none" stroke="#7DD3FC" stroke-width="2.5"/>
  <rect class="ring" x="30" y="28" width="64" height="44" rx="10" fill="none" stroke="#7DD3FC" stroke-width="2.5" style="animation-delay:.6s"/>

  <!-- OLED module -->
  <rect x="122" y="18" width="126" height="74" rx="5" fill="#1D4E89"/>
  <rect x="130" y="26" width="110" height="58" rx="2" fill="#05070B"/>
  <g transform="translate(133,29) scale(.8125)" fill="#D7ECFF">
    <!-- heart, same primitives as drawHeart(64, 30) -->
    <g class="ph-heart"><g class="beat"><circle cx="56" cy="24" r="9.5"/><circle cx="72" cy="24" r="9.5"/><polygon points="48,29 80,29 64,48"/></g></g>
    <!-- masked PIN entry -->
    <g class="ph-entry"><text x="64" y="44" font-size="30" font-weight="700" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">****</text></g>
    <!-- skull, same primitives as drawSkull(64, 34) -->
    <g class="ph-armed">
      <rect x="45" y="12" width="38" height="32" rx="12"/><rect x="53" y="38" width="22" height="13" rx="4"/>
      <circle cx="55" cy="27" r="6.5" fill="#05070B"/><circle cx="73" cy="27" r="6.5" fill="#05070B"/>
      <polygon points="64,33 61,38 67,38" fill="#05070B"/>
      <g fill="#05070B"><rect x="53" y="39" width="22" height="1"/><rect x="57" y="40" width="1" height="11"/><rect x="62" y="40" width="1" height="11"/><rect x="67" y="40" width="1" height="11"/><rect x="72" y="40" width="1" height="11"/></g>
    </g>
    <!-- alarm: the whole screen flips every 250 ms -->
    <!-- alarm: the whole screen flips every 250 ms, like drawSkull(fg, bg) -->
    <g class="ph-alarm">
      <g class="flash">
        <rect x="-4" y="-4" width="136" height="72" fill="#D7ECFF"/>
        <use href="#alarmSkull" color="#05070B" fill="#D7ECFF"/>
      </g>
      <g class="flash" style="animation-delay:-.25s"><use href="#alarmSkull" color="#D7ECFF" fill="#05070B"/></g>
    </g>
  </g>

  <!-- PIR motion sensor -->
  <rect x="260" y="14" width="50" height="82" rx="4" fill="#15803D"/>
  <circle cx="285" cy="55" r="21" fill="url(#dome)"/>
  <g fill="none" stroke="#B6BDC8" stroke-width="1"><circle cx="285" cy="55" r="7"/><circle cx="285" cy="55" r="14"/></g>
  <g class="ph-alarm"><circle class="ring" cx="285" cy="55" r="25" fill="none" stroke="#F87171" stroke-width="3"/><circle class="ring" cx="285" cy="55" r="25" fill="none" stroke="#F87171" stroke-width="3" style="animation-delay:.6s"/></g>

  <!-- keypad -->
  <rect x="14" y="106" width="116" height="128" rx="8" fill="#161B25"/>
  <g font-size="13" font-weight="700" text-anchor="middle" fill="#fff">
    <rect x="22" y="114" width="22" height="24" rx="4" fill="#3B82F6"/><rect x="50" y="114" width="22" height="24" rx="4" fill="#3B82F6"/><rect x="78" y="114" width="22" height="24" rx="4" fill="#3B82F6"/><rect x="106" y="114" width="18" height="24" rx="4" fill="#DC2626"/>
    <rect x="22" y="144" width="22" height="24" rx="4" fill="#3B82F6"/><rect x="50" y="144" width="22" height="24" rx="4" fill="#3B82F6"/><rect x="78" y="144" width="22" height="24" rx="4" fill="#3B82F6"/><rect x="106" y="144" width="18" height="24" rx="4" fill="#DC2626"/>
    <rect x="22" y="174" width="22" height="24" rx="4" fill="#3B82F6"/><rect x="50" y="174" width="22" height="24" rx="4" fill="#3B82F6"/><rect x="78" y="174" width="22" height="24" rx="4" fill="#3B82F6"/><rect x="106" y="174" width="18" height="24" rx="4" fill="#DC2626"/>
    <rect x="22" y="204" width="22" height="24" rx="4" fill="#DC2626"/><rect x="50" y="204" width="22" height="24" rx="4" fill="#3B82F6"/><rect x="78" y="204" width="22" height="24" rx="4" fill="#DC2626"/><rect x="106" y="204" width="18" height="24" rx="4" fill="#DC2626"/>
    <text x="33" y="131">1</text><text x="61" y="131">2</text><text x="89" y="131">3</text><text x="115" y="131">A</text>
    <text x="33" y="161">4</text><text x="61" y="161">5</text><text x="89" y="161">6</text><text x="115" y="161">B</text>
    <text x="33" y="191">7</text><text x="61" y="191">8</text><text x="89" y="191">9</text><text x="115" y="191">C</text>
    <text x="33" y="221">*</text><text x="61" y="221">0</text><text x="89" y="221">#</text><text x="115" y="221">D</text>
  </g>
  <!-- key presses during the PIN phase (not the real PIN) -->
  <rect class="key k1" x="22" y="114" width="22" height="24" rx="4" fill="#fff" opacity="0"/>
  <rect class="key k2" x="50" y="174" width="22" height="24" rx="4" fill="#fff" opacity="0"/>
  <rect class="key k3" x="78" y="144" width="22" height="24" rx="4" fill="#fff" opacity="0"/>
  <rect class="key k4" x="78" y="204" width="22" height="24" rx="4" fill="#fff" opacity="0"/>

  <!-- passive buzzer behind a speaker grill -->
  <circle cx="200" cy="165" r="26" fill="#1F2633" stroke="#3B475E" stroke-width="1.5"/>
  <g stroke="#0B0D12" stroke-width="3" stroke-linecap="round"><path d="M186 155 h28 M182 165 h36 M186 175 h28"/></g>
  <g class="ph-alarm"><circle class="ring" cx="200" cy="165" r="30" fill="none" stroke="#FBBF24" stroke-width="2.5"/><circle class="ring" cx="200" cy="165" r="30" fill="none" stroke="#FBBF24" stroke-width="2.5" style="animation-delay:.4s"/><circle class="ring" cx="200" cy="165" r="30" fill="none" stroke="#FBBF24" stroke-width="2.5" style="animation-delay:.8s"/></g>
  <text x="300" y="226" font-size="12" font-weight="800" letter-spacing="2" text-anchor="end" fill="#3B475E">PROJEKT GAS</text>
</g>

<!-- floating RFID card above the reader (outer group bobs, inner group is the iso plane) -->
<g class="float">
  <g transform="matrix(.866 .5 -.866 .5 880 8)">
    <rect x="20" y="24" width="84" height="54" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="29" y="34" width="17" height="13" rx="2" fill="#E2B340"/>
    <text x="96" y="70" font-size="12" font-weight="800" text-anchor="end" fill="#1E3A8A">GAS</text>
    <rect x="29" y="58" width="32" height="4" rx="2" fill="#CBD5E1"/>
  </g>
</g>
</svg>
